<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Technology Timeline</title>

<style>
body {
  font-family: Segoe UI, sans-serif;
  background: #f5f6f8;
}

.timeline {
  position: relative;
  max-width: 900px;
  margin: 50px auto;
}

.timeline::after {
  content: '';
  position: absolute;
  width: 4px;
  background-color: #2bb673;
  top: 0;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
}

.container {
  padding: 20px 40px;
  position: relative;
  width: 50%;
  cursor: pointer;
}

.container.left { left: 0; }
.container.right { left: 50%; }

.container::after {
  content: "";
  position: absolute;
  width: 16px;
  height: 16px;
  background-color: #2bb673;
  border-radius: 50%;
  top: 30px;
  z-index: 1;
}
