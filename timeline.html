<!DOCTYPE html>
<html>
<head>
<style>
body { font-family: Segoe UI; }

.timeline {
  position: relative;
  max-width: 900px;
  margin: 40px auto;
}

.timeline::after {
  content: '';
  position: absolute;
  width: 4px;
  background-color: #2bb673;
  top: 0;
  bottom: 0;
  left: 50%;
}

.container {
  width: 50%;
  padding: 20px;
  position: relative;
}

.left { left: 0; }
.right { left: 50%; }

.content {
  background: white;
  padding: 15px;
  border-radius: 8px;
}
</style>
</head>

<body>

<div class="timeline">

<div class="container left">
  <div class="content">
    <b>1991</b>
    <p>Founded</p>
  </div>
</div>

<div class="container right">
  <div class="content">
    <b>2009</b>
    <p>Expansion</p>
  </div>
</div>

</div>

</body>
</html>
